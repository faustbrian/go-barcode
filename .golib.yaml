schema_version: 1
tool_version: v1.0.14
tool_checksums_sha256: 88341d2f2904925b22ec8de084fec68c5229669f1119f066ed5fccd76aee2f82
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
operations:
- module: "."
  gate: test
  steps:
  - type: make
    makefile: verification/package.mk
    target: dependencies
    timeout: 20m
- module: "."
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: "."
  gate: conformance
  steps:
  - type: make
    makefile: verification/package.mk
    target: conformance
    timeout: 20m
- module: "."
  gate: interoperability
  steps:
  - type: make
    makefile: verification/package.mk
    target: interoperability
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["./qr"]
    fuzz: '^FuzzEncodeOptions$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./gs1"]
    fuzz: '^FuzzParseElementStrings$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./gs1"]
    fuzz: '^FuzzCheckDigits$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzPayloadEncoders$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./imagedecode"]
    fuzz: '^FuzzDecodeBoundedImages$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./render"]
    fuzz: '^FuzzRenderLogicalMatrices$'
    budget: 2s
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: make
    makefile: verification/package.mk
    target: benchmark
    timeout: 20m
